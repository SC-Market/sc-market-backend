name: Create and publish a Docker image

# Builds the backend image, pushes it to GHCR, and redeploys the `backend`
# container on the `sc-market` Lightsail service. The implementation lives in the
# org-level reusable workflow so the backend and sc-orgs share one pipeline —
# see SC-Market/.github/.github/workflows/deploy-lightsail.yml
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

# A called workflow only gets the permissions the caller grants, so these must be
# declared here as well as in the reusable workflow.
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  deploy:
    uses: SC-Market/.github/.github/workflows/deploy-lightsail.yml@main
    with:
      service-name: sc-market
      container-name: backend
      role-arn: arn:aws:iam::272095582125:role/github-actions-lightsail-deploy
      aws-region: us-east-2
      node-version: "24"
      run-tests: true
