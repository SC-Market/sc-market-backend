# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest

    # Throwaway Postgres for the real-SQL tests (*.pg.test.ts, see
    # src/test-utils/pg-test-db.ts) and for building the schema from empty.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
      - uses: actions/checkout@v4

      - name: Set Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      # The legacy SQL plus every knex migration, applied to an empty database
      # with the same `npm run migrate:latest` the deploy runs.
      - name: Build the schema from an empty database
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USER: postgres
          DATABASE_PASS: postgres
          DATABASE_TARGET: schema_from_empty
        run: |
          PGHOST=localhost PGUSER=postgres PGPASSWORD=postgres createdb "$DATABASE_TARGET"
          scripts/ci/schema-from-empty.sh

      - name: Run tests
        run: npm test

  notifications:
    # Notification characterization suite: every event type x channel, against
    # the throwaway Postgres service below. See vitest.characterization.config.ts.
    name: Notification characterization
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run notification characterization tests
        run: npm run test:notifications
